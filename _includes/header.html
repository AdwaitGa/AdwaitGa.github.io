<header class="d-flex flex-column flex-md-row align-items-center">
  <div>
    <a href="{{ site.github.url }}/" class="d-flex align-items-center text-decoration-none">
      <span class="fs-2 fw-bold">{{ site.title }}</span>
    </a>
    <a href="{{ site.github.url }}/" class="d-flex align-items-center text-decoration-none">
      <span class="fs-5">{{ site.description }}</span>
    </a>
  </div>
  <nav class="d-inline-flex mt-2 mt-md-0 ms-md-auto">
    {% for item in site.data.settings.menu %}
      <a class="me-4 py-2 fs-5 text-decoration-none" href="{{ site.github.url }}{{ item.url }}"{% if item.url == '/notes' %} onclick="try{sessionStorage.removeItem('notesUnlocked')}catch(e){}"{% endif %}>{{ item.name }}</a>
    {% endfor %}
  </nav>
</header>
