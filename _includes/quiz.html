<div id="quiz" class="mb-5" hidden>
  <h3 class="fw-bold border-bottom pb-3 mb-4">Quick question before the notes</h3>
  <p class="mb-4">Choose the picture that matches the question to continue.</p>
  <div class="quiz-row">
    <figure class="quiz-item">
      <figcaption>Question</figcaption>
      <img class="quiz-img" src="{{ site.github.url }}/assets/img/quiz/question.jpg" alt="Question">
    </figure>
    <div class="quiz-equals" aria-hidden="true">=</div>
    <div class="quiz-options" id="quiz-options">
      {% for n in (1..4) %}
      <figure class="quiz-item">
        <figcaption>Option {{ n }}</figcaption>
        <button type="button" class="quiz-option" data-id="option_{{ n }}" aria-label="Option {{ n }}">
          <img class="quiz-img" src="{{ site.github.url }}/assets/img/quiz/option_{{ n }}.jpg" alt="Option {{ n }}">
        </button>
      </figure>
      {% endfor %}
    </div>
  </div>
  <p id="quiz-msg" class="mt-4 fw-bold" role="alert" hidden>That is not the right answer. Please try again.</p>
</div>
<script>
(function () {
  var KEY = 'notesUnlocked', ANSWER = 'f8fdea035ac1a189f5fa4d4f729941f15218513bc4f1108ef5c9c306f799b71c';
  var quiz = document.getElementById('quiz');
  var gated = document.getElementById('gated');
  function unlocked() { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
  function open() { quiz.hidden = true; gated.hidden = false; }
  if (unlocked()) { open(); } else { quiz.hidden = false; }
  function sha256(text) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  document.getElementById('quiz-options').addEventListener('click', function (e) {
    var btn = e.target.closest('.quiz-option');
    if (!btn) return;
    sha256('notes-quiz:' + btn.getAttribute('data-id')).then(function (h) {
      if (h === ANSWER) {
        try { localStorage.setItem(KEY, '1'); } catch (e) {}
        open();
      } else {
        document.getElementById('quiz-msg').hidden = false;
      }
    });
  });
})();
</script>
