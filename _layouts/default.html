<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  {% include head.html %}
  <body>
    <div class="site-header">
      <div class="col-lg-11 mx-auto px-3 py-3">
        {% include header.html %}
      </div>
    </div>
    <div class="site-main {{ page.layout }}">
      <div class="col-lg-11 mx-auto p-3">
        {% if page.url contains '/notes' or page.layout == 'post' %}
          <div id="gated" hidden>{{ content }}</div>
          {% include quiz.html %}
        {% else %}
          {{ content }}
        {% endif %}
      </div>
    </div>
    <div class="site-footer">
      <div class="col-lg-11 mx-auto px-3 py-4">
        {% include footer.html %}
      </div>
    </div>
  </body>
</html>
